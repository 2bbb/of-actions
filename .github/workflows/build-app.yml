name: Build openFrameworks App

on:
  workflow_call:
    inputs:
      of_version:
        description: "openFrameworks version (e.g. '0.12.0', '0.12.1', 'nightly')"
        required: true
        type: string
      app_name:
        description: "App directory name under apps/myApps/ (e.g. 'myApp')"
        required: true
        type: string
      submodules:
        description: "Whether to checkout submodules recursively"
        type: boolean
        default: true
      preprocessor_defines:
        description: "Additional preprocessor defines for Windows (semicolon-separated)"
        type: string
        default: ""
      cache_key_suffix:
        description: "Suffix appended to cache key for busting"
        type: string
        default: "v1"
      run_app:
        description: "Whether to run the app after building"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Resolve oF download URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.of_version }}" = "nightly" ]; then TAG="nightly"; else TAG="${{ inputs.of_version }}"; fi
          ASSET=$(gh release view "$TAG" --repo openframeworks/openFrameworks --json assets --jq '.assets[].name' | grep -E '_osx_release\.' | head -1)
          echo "asset=$ASSET" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download oF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.resolve.outputs.tag }}" --repo openframeworks/openFrameworks --pattern "${{ steps.resolve.outputs.asset }}" --output of_release

      - name: Extract oF
        run: |
          FILE="of_release"
          if echo "$FILE" | grep -q '\.tar\.gz$'; then
            tar xzf "$FILE"
          else
            unzip -q "$FILE"
          fi
          EXTRACTED=$(find . -maxdepth 1 -type d ! -name '.' ! -name 'of_root' | head -1)
          mv "$EXTRACTED" of_root
          rm -f of_release

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: of_root/apps/myApps/${{ inputs.app_name }}
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: of_root/libs/openFrameworksCompiled
          key: of-${{ inputs.of_version }}-macos-${{ inputs.cache_key_suffix }}

      - name: Build
        run: make -j$(sysctl -n hw.ncpu)
        working-directory: of_root/apps/myApps/${{ inputs.app_name }}

      - name: Run
        if: inputs.run_app
        continue-on-error: true
        run: ./bin/${{ inputs.app_name }}.app/Contents/MacOS/${{ inputs.app_name }}
        working-directory: of_root/apps/myApps/${{ inputs.app_name }}

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve oF download URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.of_version }}" = "nightly" ]; then TAG="nightly"; else TAG="${{ inputs.of_version }}"; fi
          ASSET=$(gh release view "$TAG" --repo openframeworks/openFrameworks --json assets --jq '.assets[].name' | grep -E '_linux64.*_release\.' | head -1)
          echo "asset=$ASSET" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download oF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.resolve.outputs.tag }}" --repo openframeworks/openFrameworks --pattern "${{ steps.resolve.outputs.asset }}" --output of_release.tar.gz

      - name: Extract oF
        run: |
          tar xzf of_release.tar.gz
          EXTRACTED=$(find . -maxdepth 1 -type d ! -name '.' ! -name 'of_root' | head -1)
          mv "$EXTRACTED" of_root
          rm -f of_release.tar.gz

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: of_root/apps/myApps/${{ inputs.app_name }}
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Install oF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev libboost-filesystem-dev libboost-system-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxmu-dev \
            libxxf86vm-dev libx11-dev x11proto-dev \
            libgl-dev libglew-dev freeglut3-dev libglu1-mesa-dev \
            libglfw3-dev libcurl4-openssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio \
            gstreamer1.0-alsa gstreamer1.0-x \
            libcairo2-dev libfreeimage-dev libfreetype6-dev libssl-dev \
            libpulse-dev libasound2-dev libmpg123-dev liburiparser-dev \
            libsndfile1-dev libopenal-dev \
            libassimp-dev libpugixml-dev \
            libdrm-dev libgbm-dev libegl-dev \
            libjack-jackd2-dev librtaudio-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev \
            libraw1394-dev libudev-dev libusb-1.0-0-dev \
            cmake gdb

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: of_root/libs/openFrameworksCompiled
          key: of-${{ inputs.of_version }}-linux-${{ inputs.cache_key_suffix }}

      - name: Build
        run: make -j$(nproc)
        working-directory: of_root/apps/myApps/${{ inputs.app_name }}

      - name: Run
        if: inputs.run_app
        continue-on-error: true
        run: xvfb-run ./bin/${{ inputs.app_name }}
        working-directory: of_root/apps/myApps/${{ inputs.app_name }}

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Resolve oF download URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if ("${{ inputs.of_version }}" -eq "nightly") { $TAG = "nightly" } else { $TAG = "${{ inputs.of_version }}" }
          $ASSET = (gh release view $TAG --repo openframeworks/openFrameworks --json assets --jq '.assets[].name') | Where-Object { $_ -match '_vs_release\.' } | Select-Object -First 1
          echo "asset=$ASSET" >> $env:GITHUB_OUTPUT
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT

      - name: Download oF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release download "${{ steps.resolve.outputs.tag }}" --repo openframeworks/openFrameworks --pattern "${{ steps.resolve.outputs.asset }}" --output of_release.zip

      - name: Extract oF
        shell: pwsh
        run: |
          Expand-Archive -Path of_release.zip -DestinationPath .
          $EXTRACTED = (Get-ChildItem -Directory -Depth 0 | Where-Object { $_.Name -ne 'of_root' }).Name | Select-Object -First 1
          Rename-Item -Path $EXTRACTED -NewName of_root
          Remove-Item of_release.zip

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: of_root/apps/myApps/${{ inputs.app_name }}
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: of_root/libs/openFrameworksCompiled
          key: of-${{ inputs.of_version }}-windows-${{ inputs.cache_key_suffix }}

      - name: Generate project
        shell: pwsh
        run: |
          $pg = "of_root\projectGenerator\resources\app\app\projectGenerator.exe"
          & $pg --ofPath="of_root" "of_root\apps\myApps\${{ inputs.app_name }}"

      - name: Inject preprocessor defines
        if: inputs.preprocessor_defines != ''
        shell: pwsh
        run: |
          $props = @"
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <PreprocessorDefinitions>${{ inputs.preprocessor_defines }};%(PreprocessorDefinitions)</PreprocessorDefinitions>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          "@
          Set-Content -Path "of_root\apps\myApps\${{ inputs.app_name }}\Directory.Build.props" -Value $props

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild "of_root\apps\myApps\${{ inputs.app_name }}\${{ inputs.app_name }}.vcxproj" /p:configuration=release /p:platform=x64 /maxCpuCount

      - name: Run
        if: inputs.run_app
        continue-on-error: true
        shell: pwsh
        run: |
          & "of_root\apps\myApps\${{ inputs.app_name }}\bin\${{ inputs.app_name }}.exe"
