name: Build openFrameworks Addon (v2)

on:
  workflow_call:
    inputs:
      of_version:
        description: "openFrameworks version (e.g. '0.12.0', '0.12.1', 'nightly')"
        required: true
        type: string
      addon_name:
        description: "Addon directory name under addons/"
        required: true
        type: string
      test_app:
        description: "Test app directory under addons/{addon_name}/"
        required: true
        type: string
      submodules:
        description: "Checkout submodules recursively"
        type: boolean
        default: true
      preprocessor_defines:
        description: "Windows preprocessor defines (semicolon-separated)"
        type: string
        default: ""
      cache_key_suffix:
        description: "Cache key suffix for busting"
        type: string
        default: "v1"
      test_mode:
        description: "build-only | run (non-blocking) | test (fail on error)"
        type: string
        default: "run"
      configs:
        description: "Build configurations as JSON array (e.g. '[\"Release\"]' or '[\"Debug\",\"Release\"]')"
        type: string
        default: '["Release"]'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    strategy:
      matrix:
        config: ${{ fromJson(inputs.configs) }}
    steps:
      - name: Resolve oF download URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.of_version }}" = "nightly" ]; then TAG="nightly"; else TAG="${{ inputs.of_version }}"; fi
          ASSET=$(gh release view "$TAG" --repo openframeworks/openFrameworks --json assets --jq '.assets[].name' | grep -E '_osx_release\.' | head -1)
          echo "asset=$ASSET" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download oF
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          ASSET="${{ steps.resolve.outputs.asset }}"
          curl -sL "https://github.com/openframeworks/openFrameworks/releases/download/${TAG}/${ASSET}" -o "$ASSET"
          if [[ "$ASSET" == *.tar.gz ]]; then
            tar xzf "$ASSET"
          else
            unzip -q "$ASSET"
          fi
          rm -f "$ASSET"
          rm -rf of_root
          mv of_v*_osx_release of_root 2>/dev/null || mv of_v*_osx* of_root

      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          path: of_root/addons/${{ inputs.addon_name }}
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: of_root/libs/openFrameworksCompiled
          key: of-${{ inputs.of_version }}-macos-${{ matrix.config }}-${{ inputs.cache_key_suffix }}

      - name: Build
        run: make -j$(sysctl -n hw.ncpu) ${{ matrix.config }}
        working-directory: of_root/addons/${{ inputs.addon_name }}/${{ inputs.test_app }}

      - name: Run
        id: run
        if: inputs.test_mode != 'build-only'
        continue-on-error: true
        run: make Run${{ matrix.config }} 2>&1 | tee /tmp/of_run.log; echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        working-directory: of_root/addons/${{ inputs.addon_name }}/${{ inputs.test_app }}

      - name: Check result
        if: inputs.test_mode != 'build-only'
        run: |
          CODE=${{ steps.run.outputs.exit_code }}
          if [ -z "$CODE" ]; then CODE=1; fi
          echo "Exit code: $CODE"
          if [ "$CODE" -ge 128 ]; then
            echo "::error::Process crashed with signal (exit code $CODE)"
            exit 1
          fi
          if [ "${{ inputs.test_mode }}" = "test" ] && [ "$CODE" -ne 0 ]; then
            echo "::error::Tests failed (exit code $CODE)"
            exit 1
          fi

  build-macos-xcode:
    runs-on: macos-14
    strategy:
      matrix:
        config: ${{ fromJson(inputs.configs) }}
    steps:
      - name: Resolve oF download URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.of_version }}" = "nightly" ]; then TAG="nightly"; else TAG="${{ inputs.of_version }}"; fi
          ASSET=$(gh release view "$TAG" --repo openframeworks/openFrameworks --json assets --jq '.assets[].name' | grep -E '_osx_release\.' | head -1)
          echo "asset=$ASSET" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download oF
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          ASSET="${{ steps.resolve.outputs.asset }}"
          curl -sL "https://github.com/openframeworks/openFrameworks/releases/download/${TAG}/${ASSET}" -o "$ASSET"
          if [[ "$ASSET" == *.tar.gz ]]; then
            tar xzf "$ASSET"
          else
            unzip -q "$ASSET"
          fi
          rm -f "$ASSET"
          rm -rf of_root
          mv of_v*_osx_release of_root 2>/dev/null || mv of_v*_osx* of_root

      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          path: of_root/addons/${{ inputs.addon_name }}
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: of_root/libs/openFrameworksCompiled
          key: of-${{ inputs.of_version }}-macos-xcode-${{ matrix.config }}-${{ inputs.cache_key_suffix }}

      - name: Generate Xcode project
        run: |
          PG="of_root/projectGenerator/projectGenerator.app/Contents/Resources/app/app/projectGenerator"
          chmod +x "$PG"
          "$PG" --ofPath="$(pwd)/of_root" -p"osx" "$(pwd)/of_root/addons/${{ inputs.addon_name }}/${{ inputs.test_app }}"

      - name: Build
        run: |
          PROJECT="of_root/addons/${{ inputs.addon_name }}/${{ inputs.test_app }}/${{ inputs.test_app }}.xcodeproj"
          xcodebuild -project "$PROJECT" -configuration ${{ matrix.config }} build

      - name: Run
        id: run
        if: inputs.test_mode != 'build-only'
        continue-on-error: true
        run: |
          BIN="of_root/addons/${{ inputs.addon_name }}/${{ inputs.test_app }}/bin"
          if [ "${{ matrix.config }}" = "Debug" ]; then
            EXEC="$BIN/${{ inputs.test_app }}_debug"
          else
            EXEC="$BIN/${{ inputs.test_app }}"
          fi
          if [ ! -f "$EXEC" ]; then
            echo "::error::Binary not found: $EXEC"
            echo "exit_code=127" >> $GITHUB_OUTPUT
            exit 1
          fi
          "$EXEC" 2>&1 | tee /tmp/of_run.log; echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Check result
        if: inputs.test_mode != 'build-only'
        run: |
          CODE=${{ steps.run.outputs.exit_code }}
          if [ -z "$CODE" ]; then CODE=1; fi
          echo "Exit code: $CODE"
          if [ "$CODE" -ge 128 ]; then
            echo "::error::Process crashed with signal (exit code $CODE)"
            exit 1
          fi
          if [ "${{ inputs.test_mode }}" = "test" ] && [ "$CODE" -ne 0 ]; then
            echo "::error::Tests failed (exit code $CODE)"
            exit 1
          fi

  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        config: ${{ fromJson(inputs.configs) }}
    steps:
      - name: Resolve oF download URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.of_version }}" = "nightly" ]; then TAG="nightly"; else TAG="${{ inputs.of_version }}"; fi
          ASSET=$(gh release view "$TAG" --repo openframeworks/openFrameworks --json assets --jq '.assets[].name' | grep -E '_linux64.*_release\.' | head -1)
          echo "asset=$ASSET" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download oF
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          ASSET="${{ steps.resolve.outputs.asset }}"
          curl -sL "https://github.com/openframeworks/openFrameworks/releases/download/${TAG}/${ASSET}" -o "$ASSET"
          tar xzf "$ASSET"
          rm -f "$ASSET"
          rm -rf of_root
          mv of_v*_linux64* of_root

      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          path: of_root/addons/${{ inputs.addon_name }}
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Install oF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev libboost-filesystem-dev libboost-system-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxmu-dev \
            libxxf86vm-dev libx11-dev x11proto-dev \
            libgl-dev libglew-dev freeglut3-dev libglu1-mesa-dev \
            libglfw3-dev libcurl4-openssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio \
            gstreamer1.0-alsa gstreamer1.0-x \
            libcairo2-dev libfreeimage-dev libfreetype6-dev libssl-dev \
            libpulse-dev libasound2-dev libmpg123-dev liburiparser-dev \
            libsndfile1-dev libopenal-dev \
            libassimp-dev libpugixml-dev \
            libdrm-dev libgbm-dev libegl-dev \
            libjack-jackd2-dev librtaudio-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev \
            libraw1394-dev libudev-dev libusb-1.0-0-dev \
            cmake gdb

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: of_root/libs/openFrameworksCompiled
          key: of-${{ inputs.of_version }}-linux-${{ matrix.config }}-${{ inputs.cache_key_suffix }}

      - name: Build
        run: make -j$(nproc) ${{ matrix.config }}
        working-directory: of_root/addons/${{ inputs.addon_name }}/${{ inputs.test_app }}

      - name: Run
        id: run
        if: inputs.test_mode != 'build-only'
        continue-on-error: true
        run: xvfb-run make Run${{ matrix.config }} 2>&1 | tee /tmp/of_run.log; echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        working-directory: of_root/addons/${{ inputs.addon_name }}/${{ inputs.test_app }}

      - name: Check result
        if: inputs.test_mode != 'build-only'
        run: |
          CODE=${{ steps.run.outputs.exit_code }}
          if [ -z "$CODE" ]; then CODE=1; fi
          echo "Exit code: $CODE"
          if [ "$CODE" -ge 128 ]; then
            echo "::error::Process crashed with signal (exit code $CODE)"
            exit 1
          fi
          if [ "${{ inputs.test_mode }}" = "test" ] && [ "$CODE" -ne 0 ]; then
            echo "::error::Tests failed (exit code $CODE)"
            exit 1
          fi

  build-windows:
    runs-on: windows-2022
    strategy:
      matrix:
        config: ${{ fromJson(inputs.configs) }}
    steps:
      - name: Resolve oF download URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if ("${{ inputs.of_version }}" -eq "nightly") { $TAG = "nightly" } else { $TAG = "${{ inputs.of_version }}" }
          $ASSET = (gh release view $TAG --repo openframeworks/openFrameworks --json assets --jq '.assets[].name') | Where-Object { $_ -match '_vs_release\.' } | Select-Object -First 1
          echo "asset=$ASSET" >> $env:GITHUB_OUTPUT
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT

      - name: Download oF
        shell: pwsh
        run: |
          $tag = "${{ steps.resolve.outputs.tag }}"
          $asset = "${{ steps.resolve.outputs.asset }}"
          $url = "https://github.com/openframeworks/openFrameworks/releases/download/$tag/$asset"
          Invoke-WebRequest -Uri $url -OutFile $asset
          Expand-Archive -Path $asset -DestinationPath .
          Remove-Item $asset
          if (Test-Path "of_root") { Remove-Item -Recurse -Force "of_root" }
          $dir = Get-ChildItem -Directory -Filter "of_v*_vs_release*" | Select-Object -First 1
          if ($dir) { Rename-Item -Path $dir.FullName -NewName "of_root" }

      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          path: of_root/addons/${{ inputs.addon_name }}
          submodules: ${{ inputs.submodules && 'recursive' || 'false' }}

      - name: Cache oF build
        uses: actions/cache@v4
        with:
          path: of_root/libs/openFrameworksCompiled
          key: of-${{ inputs.of_version }}-windows-${{ matrix.config }}-${{ inputs.cache_key_suffix }}

      - name: Generate project
        shell: pwsh
        run: |
          $pg = "of_root\projectGenerator\resources\app\app\projectGenerator.exe"
          & $pg --ofPath="of_root" --platforms="vs" "of_root\addons\${{ inputs.addon_name }}\${{ inputs.test_app }}"

      - name: Inject preprocessor defines
        if: inputs.preprocessor_defines != ''
        shell: pwsh
        run: |
          $props = @"
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <PreprocessorDefinitions>${{ inputs.preprocessor_defines }};%(PreprocessorDefinitions)</PreprocessorDefinitions>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          "@
          Set-Content -Path "of_root\addons\${{ inputs.addon_name }}\${{ inputs.test_app }}\Directory.Build.props" -Value $props

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild "of_root\addons\${{ inputs.addon_name }}\${{ inputs.test_app }}\${{ inputs.test_app }}.vcxproj" /p:configuration=${{ matrix.config }} /p:platform=x64 /maxCpuCount

      - name: Run
        id: run
        if: inputs.test_mode != 'build-only'
        continue-on-error: true
        shell: pwsh
        run: |
          $binDir = "of_root\addons\${{ inputs.addon_name }}\${{ inputs.test_app }}\bin"
          $exe = Join-Path $binDir "${{ inputs.test_app }}.exe"
          # oF Debug builds use <TargetName>$(ProjectName)_debug</TargetName>
          if ("${{ matrix.config }}" -eq "Debug" -and -not (Test-Path $exe)) {
            $exe = Join-Path $binDir "${{ inputs.test_app }}_debug.exe"
          }
          if (-not (Test-Path $exe)) {
            echo "::error::Binary not found: $exe"
            "exit_code=127" >> $env:GITHUB_OUTPUT
            exit 1
          }
          & $exe
          $code = $LASTEXITCODE
          # Convert signed negative exit codes to unsigned (e.g. -1073741819 -> 3221225477)
          if ($code -lt 0) { $code = [uint32]$code }
          "exit_code=$code" >> $env:GITHUB_OUTPUT

      - name: Check result
        if: inputs.test_mode != 'build-only'
        shell: bash
        run: |
          CODE=${{ steps.run.outputs.exit_code }}
          if [ -z "$CODE" ]; then CODE=1; fi
          echo "Exit code: $CODE"
          if [ "$CODE" -ge 128 ]; then
            echo "::error::Process crashed with signal (exit code $CODE)"
            exit 1
          fi
          # Windows crash codes (0xC0000005 = 3221225477, etc.)
          if [ "$CODE" -ge 100000 ]; then
            echo "::error::Process crashed (exit code $CODE)"
            exit 1
          fi
          if [ "${{ inputs.test_mode }}" = "test" ] && [ "$CODE" -ne 0 ]; then
            echo "::error::Tests failed (exit code $CODE)"
            exit 1
          fi
